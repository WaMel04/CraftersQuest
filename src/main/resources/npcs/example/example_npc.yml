# CraftersQuest Plugin by WaMel_ (Discord: wamel04)

# 퀘스트의 category는 상위 폴더의 이름입니다.
# '&'를 색상코드로 사용할 수 있습니다.
# MineDown과 PlaceHolderAPI를 지원합니다.

# ========================================= ##### NPC Example ##### =========================================
# 해당 이름을 가진 NPC를 우클릭 시 대화 스크립트가 실행됩니다. (색상 구분 X)
name: "예시_NPC"

# 대화 스크립트를 실행하기 위해 필요한 펄미션입니다.
# disabled를 입력 시 펄미션이 필요하지 않습니다.
permission: "disabled"

# ===========================================================================================================
# 대화 스크립트 실행 시 처음으로 나올 페이지를 설정합니다.
# 퀘스트 조건에 따라 나올 페이지를 다르게 설정할 수 있습니다.

# 조건문은 순서대로 판단됩니다.
# 퀘스트명은 대소문자를 구분하지 않습니다.
# ===========================================================================================================
# 조건문 타입
# NOT_REQUEST (퀘스트명): 해당 퀘스트를 아직 받지 않았을 경우 참이 됩니다.
# PROCEEDING (퀘스트명): 해당 퀘스트를 받아 진행 중일 경우 참이 됩니다.
# COMPLETED (퀘스트명): 해당 퀘스트를 완료했을 경우 참이 됩니다.
# DEFAULT: 모든 조건문을 통과하지 못했을 경우 나올 페이지입니다. 맨 마지막에 적어주세요.
# ===========================================================================================================
# 조건문 연산자
# (조건문) && (조건문): 논리 곱 연산. 두 조건문 모두 참일 경우 참이 됩니다. (and)
# (조건문) || (조건문) : 논리 합 연산. 두 조건문 중 하나라도 참일 경우 참이 됩니다. (or)

# 논리 구조에 따라 조건문을 괄호로 묶을 수 있습니다. | (A || B) & C : A또는 B가 참이면서, C가 참일 경우 참
# ===========================================================================================================
first-page-conditions:
  "NOT_REQUESTED example_quest_1": "eq1_page_1"
  "COMPLETED example_quest_1 && NOT_REQUESTED example_quest_2": "eq2_page_1"
  "DEFAULT": "default_page_1"

# NPC와 대화 중 나오는 페이지를 설정합니다.
# 쉬프트 시 대화를 종료합니다.
pages:
  "eq1_page_1":
    - "$send '안녕하세요. 첫번째 퀘스트를 드리겠습니다.'"
    - "$page 'eq1_page_2'" # 우클릭 시 해당 페이지를 엽니다.
  "eq1_page_2":
    - "$send '자기 자신을 사랑할 줄 알아야죠. 먼저 `/me` 명령어를 입력해보세요!'"
    - "$set_quest_state 'example_quest_1' 'PROCEEDING'"
    - "$exit"
  "eq2_page_1":
    - "$send '두번째 퀘스트를 드리겠습니다.'"
    - "$page 'eq2_page_2'"
  "eq2_page_2":
    - "$send '&6흙&f을 부쉈다가, 다시 설치해보세요.'"
    - "$set_quest_state 'example_quest_2' 'PROCEEDING'"
    - "$exit"
  "default_page_1":
    - "$send '안녕하세요, 저는 예시 NPC입니다.'"
    - "$exit"