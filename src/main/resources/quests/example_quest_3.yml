# CraftersQuest Plugin by WaMel_ (Discord: wamel04)

# 퀘스트의 category는 상위 폴더의 이름입니다.
# '&'를 색상코드로 사용할 수 있습니다.

# ========================================= ##### Quest Example ##### =========================================

# 퀘스트의 이름입니다.
name: "&d선물 구해오기"

# 퀘스트의 설명입니다. (적지 않아도 됩니다.)
descriptions:
  - "&x&B&0&9&D&F&D해피버스데이, 나!"
  - "&d생일을 축하하세요"

# 퀘스트의 취소 가능 여부입니다.
cancellable: true

# 해당 퀘스트를 완료하는데 필요한 조건들입니다.
conditions:
  collect_cond_1:
    trigger-condition: "COLLECT_ITEM 'CHICKEN' '5'"
    condition-descriptions: # 조건의 설명입니다. (적지 않아도 됩니다.)
      - "치킨 좋아하시나요..?"
      - "저도 정말 좋아해요"
    name: "치킨 구해오기"
    progress-operations:
      - "$send '%condition_name% 진행 중... &7(%current_progress%/%max_progress%) &8(%progress_percent%%)'"
    complete-operations:
      - "$send '&6이 정도면 충분하겠지? (익히지 않은 닭고기 5개를 모았습니다)'"
  collect_cond_2:
    trigger-condition: "COLLECT_ITEM 'CRYSTAL' '5'"
    name: "&3크리스탈 구해오기"
    progress-operations:
      - "$send '%condition_name% 진행 중... &7(%current_progress%/%max_progress%) &8(%progress_percent%%)'"
    complete-operations:
      - "$send '&f이 정도면 충분할꺼야... (크리스탈 5개를 모았습니다)'"

# 퀘스트를 완료할 시 실행되는 명령의 목록입니다.
quest-complete-operations:
  - "$title '&a&l축하합니다!' '&f생일 선물을 모두 모아오셨어요!' '3' '10' '10'"